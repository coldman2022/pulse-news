name: Update news and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: node --check static/app.js
      - run: node --check static/opportunities.js
      - run: node --check static/digest.js
      - run: node --check static/events.js
      - run: node --check static/reddit.js
      - run: node --check static/currency.js

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the last successful RSS snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            _site/news.json
            _site/reddit.json
            _site/currency.json
          key: rss-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rss-
      - name: Recover the published news archive if cache is unavailable
        run: |
          if [ ! -s _site/news.json ]; then
            mkdir -p _site
            curl --fail --location --silent --show-error --retry 2 --max-time 25 \
              'https://coldman2022.github.io/pulse-news/news.json' -o _site/news.json \
              || rm -f _site/news.json
          fi
          if [ ! -s _site/reddit.json ]; then
            curl --fail --location --silent --show-error --max-time 15 \
              'https://coldman2022.github.io/pulse-news/reddit.json' -o _site/reddit.json \
              || rm -f _site/reddit.json
          if [ ! -s _site/currency.json ]; then
            curl --fail --location --silent --show-error --max-time 12 \
              'https://coldman2022.github.io/pulse-news/currency.json' -o _site/currency.json \
              || rm -f _site/currency.json
          fi
          fi
      - name: Fetch RSS and build the static site
        run: python build_site.py
      - name: Save RSS for partial source outages
        uses: actions/cache/save@v4
        with:
          path: |
            _site/news.json
            _site/reddit.json
            _site/currency.json
          key: rss-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
